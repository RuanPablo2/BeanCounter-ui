<h2 mat-dialog-title>Nova Transação</h2>

<mat-dialog-content>
  <form [formGroup]="transactionForm" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="description" placeholder="Salário, Supermercado..." />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Valor</mat-label>
      <input matInput type="number" formControlName="amount" placeholder="0.00" />
      <span matTextPrefix>R$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Categoria</mat-label>
      <input matInput formControlName="category" placeholder="Ex: Alimentação, Transporte">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Data</mat-label>
      <input matInput type="date" formControlName="date" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="type">
        <mat-option value="INCOME">Receita</mat-option>
        <mat-option value="EXPENSE">Despesa</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="transactionForm.invalid" (click)="onSave()">
    Salvar
  </button>
</mat-dialog-actions>
