<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>BeanCounter</mat-card-title>
      <mat-card-subtitle>Crie sua conta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome Completo</mat-label>
          <input
            matInput
            type="text"
            formControlName="name"
            placeholder="João da Silva"
          />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="registerForm.get('name')?.hasError('required')"
            >O nome é obrigatório</mat-error
          >
          <mat-error *ngIf="registerForm.get('name')?.hasError('minlength')"
            >O nome deve ter no mínimo 3 caracteres</mat-error
          >
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="exemplo@email.com"
          />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')"
            >O e-mail é obrigatório</mat-error
          >
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')"
            >Digite um e-mail válido</mat-error
          >
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
          />
          <mat-icon matPrefix>lock</mat-icon>
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Alternar visibilidade da senha'"
          >
            <mat-icon>{{
              hidePassword ? "visibility_off" : "visibility"
            }}</mat-icon>
          </button>
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')"
            >A senha é obrigatória</mat-error
          >
          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')"
            >A senha deve ter no mínimo 6 caracteres</mat-error
          >
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width register-btn"
          [disabled]="registerForm.invalid"
        >
          Cadastrar
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <p class="login-link">
        Já possui uma conta? <a routerLink="/login">Entre aqui</a>
      </p>
    </mat-card-footer>
  </mat-card>
</div>
